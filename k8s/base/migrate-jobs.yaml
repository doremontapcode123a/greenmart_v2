# Mỗi service migrate DB của chính nó bằng một Job (Deployment đặt RUN_MIGRATE=0 để nhiều replica không migrate đồng thời).
# Job tự xóa sau 10 phút. Nếu apply lại khi Job cũ còn tồn tại và đổi image:
#   kubectl -n greenmart delete job -l app.kubernetes.io/component=migrate
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: greenmart
    app.kubernetes.io/component: migrate
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: greenmart
        app.kubernetes.io/component: migrate
        greenmart/db-client: 'true'
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: migrate
        image: greenmart/user-service
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - n=0; until python manage.py migrate --noinput; do n=$((n+1)); [ $n -ge 30 ] && exit 1; echo 'DB chưa sẵn sàng, thử
          lại sau 5s'; sleep 5; done
        envFrom:
        - configMapRef:
            name: greenmart-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: SECRET_KEY
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: INTERNAL_API_TOKEN
        - name: DB_NAME
          value: user_db
        - name: DB_USER
          value: user_svc
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: USER_DB_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

