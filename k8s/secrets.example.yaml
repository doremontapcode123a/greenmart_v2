type: Opaque
stringData:
  SECRET_KEY: CHANGE_ME
  INTERNAL_API_TOKEN: CHANGE_ME
  MYSQL_ROOT_PASSWORD: CHANGE_ME
  USER_DB_PASSWORD: CHANGE_ME
  CATALOG_DB_PASSWORD: CHANGE_ME
  ORDER_DB_PASSWORD: CHANGE_ME
  PROMOTION_DB_PASSWORD: CHANGE_ME
  WEB_DB_PASSWORD: CHANGE_ME
  EMAIL_HOST_PASSWORD: CHANGE_ME
