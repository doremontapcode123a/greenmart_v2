# Tạo 5 database + 5 tài khoản trên RDS (idempotent: chạy lại an toàn, sẽ đặt lại mật khẩu theo Secret).
# Cần Secret key RDS_ADMIN_USER / RDS_ADMIN_PASSWORD (tài khoản master của RDS); host lấy từ DB_HOST trong ConfigMap.
apiVersion: batch/v1
kind: Job
metadata:
  name: rds-init
  labels:
    app.kubernetes.io/name: rds-init
    app.kubernetes.io/part-of: greenmart
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rds-init
        app.kubernetes.io/part-of: greenmart
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: mysql
          image: mysql:8.0
          envFrom:
            - configMapRef: { name: greenmart-config }
          env:
            - { name: RDS_ADMIN_USER,       valueFrom: { secretKeyRef: { name: greenmart-secrets, key: RDS_ADMIN_USER } } }
            - { name: MYSQL_PWD,            valueFrom: { secretKeyRef: { name: greenmart-secrets, key: RDS_ADMIN_PASSWORD } } }
            - { name: USER_DB_PASSWORD,      valueFrom: { secretKeyRef: { name: greenmart-secrets, key: USER_DB_PASSWORD } } }
            - { name: CATALOG_DB_PASSWORD,   valueFrom: { secretKeyRef: { name: greenmart-secrets, key: CATALOG_DB_PASSWORD } } }
            - { name: ORDER_DB_PASSWORD,     valueFrom: { secretKeyRef: { name: greenmart-secrets, key: ORDER_DB_PASSWORD } } }
            - { name: PROMOTION_DB_PASSWORD, valueFrom: { secretKeyRef: { name: greenmart-secrets, key: PROMOTION_DB_PASSWORD } } }
            - { name: WEB_DB_PASSWORD,       valueFrom: { secretKeyRef: { name: greenmart-secrets, key: WEB_DB_PASSWORD } } }
          command:
            - sh
            - -ec
            - |
              mysql -h "$DB_HOST" -P "${DB_PORT:-3306}" -u "$RDS_ADMIN_USER" <<SQL
              CREATE DATABASE IF NOT EXISTS user_db      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS catalog_db   CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS order_db     CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS promotion_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS web_db       CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;

              CREATE USER IF NOT EXISTS 'user_svc'@'%'      IDENTIFIED WITH mysql_native_password BY '${USER_DB_PASSWORD}';
              CREATE USER IF NOT EXISTS 'catalog_svc'@'%'   IDENTIFIED WITH mysql_native_password BY '${CATALOG_DB_PASSWORD}';
              CREATE USER IF NOT EXISTS 'order_svc'@'%'     IDENTIFIED WITH mysql_native_password BY '${ORDER_DB_PASSWORD}';
              CREATE USER IF NOT EXISTS 'promotion_svc'@'%' IDENTIFIED WITH mysql_native_password BY '${PROMOTION_DB_PASSWORD}';
              CREATE USER IF NOT EXISTS 'web_svc'@'%'       IDENTIFIED WITH mysql_native_password BY '${WEB_DB_PASSWORD}';
              ALTER USER 'user_svc'@'%'      IDENTIFIED BY '${USER_DB_PASSWORD}';
              ALTER USER 'catalog_svc'@'%'   IDENTIFIED BY '${CATALOG_DB_PASSWORD}';
              ALTER USER 'order_svc'@'%'     IDENTIFIED BY '${ORDER_DB_PASSWORD}';
              ALTER USER 'promotion_svc'@'%' IDENTIFIED BY '${PROMOTION_DB_PASSWORD}';
              ALTER USER 'web_svc'@'%'       IDENTIFIED BY '${WEB_DB_PASSWORD}';

              GRANT ALL PRIVILEGES ON user_db.*      TO 'user_svc'@'%';
              GRANT ALL PRIVILEGES ON catalog_db.*   TO 'catalog_svc'@'%';
              GRANT ALL PRIVILEGES ON order_db.*     TO 'order_svc'@'%';
              GRANT ALL PRIVILEGES ON promotion_db.* TO 'promotion_svc'@'%';
              GRANT ALL PRIVILEGES ON web_db.*       TO 'web_svc'@'%';
              FLUSH PRIVILEGES;
              SQL
