# Overlay EKS: RDS MySQL (tạo bằng Terraform: infra/terraform) + EBS gp3 cho ảnh sản phẩm + ALB HTTP.
# CHƯA có: Route 53, TLS/ACM. Cần AWS Load Balancer Controller (infra/eks-bootstrap).  Triển khai:  kubectl apply -k k8s/overlays/eks
# Đổi các giá trị đánh dấu "ĐỔI" (account id ECR, RDS endpoint). Sau khi có DNS của load balancer: xem README.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greenmart

resources:
  - ../../base
  - storageclass-ebs.yaml
  - ingress-alb.yaml
  - networkpolicy-monitoring.yaml
  
# Image ECR (ĐỔI account id/region/tag). Khớp theo tên image sau khi base đã áp dụng `images:`.
images:
  - { name:  docker.io/noobcoder1219/user-service,      newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/user-service,      newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/catalog-service,    newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/catalog-service,   newTag: 1.0.1 }
  - { name: docker.io/noobcoder1219/order-service,      newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/order-service,     newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/promotion-service,  newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/promotion-service, newTag: 1.0.0 }
  - { name: docker.io/noobcoder1219/web,                newName: 410098332444.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/web,               newTag: 1.0.0 }

patches:
  # --- Dùng RDS: bỏ MySQL container ---
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: mysql-init }
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: allow-db-clients-to-mysql }

  # --- ConfigMap: RDS endpoint + chạy HTTP (chưa có domain/TLS) ---
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: greenmart-config }
      data:
        DB_HOST: greenmart-mysql.c78uwqck0isg.ap-southeast-1.rds.amazonaws.com   # ĐỔI: output rds_address của Terraform
        PUBLIC_SCHEME: http
        PUBLIC_HOST: k8s-greenmar-greenmar-8cc3475723-52143455.ap-southeast-1.elb.amazonaws.com            # ĐỔI sau khi có DNS của LoadBalancer (dùng cho link trong email đặt lại mật khẩu)
        CSRF_TRUSTED_ORIGINS: http://k8s-greenmar-greenmar-8cc3475723-52143455.ap-southeast-1.elb.amazonaws.com   # ĐỔI cùng lúc: http://<DNS của LoadBalancer>
        WEB_ALLOWED_HOSTS: "*"            # chưa có domain cố định; siết lại khi có domain
        ENABLE_PROMETHEUS: "1"
        PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
        ENABLE_XRAY: "1"
        XRAY_DAEMON_ADDRESS: xray-daemon.monitoring:2000
  # --- Ảnh sản phẩm trên EBS (ReadWriteOnce): catalog-service chạy 1 replica, cập nhật kiểu Recreate ---
  - target: { kind: PersistentVolumeClaim, name: greenmart-media }
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
      - op: add
        path: /spec/storageClassName
        value: ebs-gp3
  - target: { kind: Deployment, name: catalog-service }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy
        value: { type: Recreate }
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: catalog-service }

  # --- Gateway: không mount volume ảnh, proxy /media/ về catalog; mở ra Internet qua ALB (Ingress, HTTP) ---
  - path: gateway-nginx-patch.yaml
  - target: { kind: Deployment, name: gateway }
    patch: |-
      - op: remove
        path: /spec/template/spec/volumes/2
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/3
  # Service gateway giữ ClusterIP; ALB do Ingress `greenmart-alb` tạo (ingress-alb.yaml). Bỏ Ingress nginx của base.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: { name: greenmart }

  # --- NetworkPolicy: traffic từ load balancer không đến từ namespace ingress ---
  - target: { kind: NetworkPolicy, name: allow-ingress-controller-to-gateway }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock: { cidr: 0.0.0.0/0 }
