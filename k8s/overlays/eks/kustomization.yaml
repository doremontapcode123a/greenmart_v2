# Overlay EKS: ALB (TLS bằng ACM) + EFS cho ảnh sản phẩm + RDS MySQL thay cho MySQL container.
# Triển khai:  kubectl apply -k k8s/overlays/eks
# TÌM VÀ ĐỔI mọi giá trị đánh dấu "ĐỔI" (account id, domain, RDS endpoint, ACM ARN, EFS id ở storageclass-efs.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: greenmart

resources:
  - ../../base
  - storageclass-efs.yaml
  - rds-init-job.yaml

# Image ECR (ĐỔI account id/region/tag). Khớp theo tên image sau khi base đã áp dụng `images:`.
images:
  - { name: registry.example.com/greenmart/user-service,      newName: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/user-service,      newTag: 1.0.0 }
  - { name: registry.example.com/greenmart/catalog-service,   newName: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/catalog-service,   newTag: 1.0.0 }
  - { name: registry.example.com/greenmart/order-service,     newName: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/order-service,     newTag: 1.0.0 }
  - { name: registry.example.com/greenmart/promotion-service, newName: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/promotion-service, newTag: 1.0.0 }
  - { name: registry.example.com/greenmart/web,               newName: 111122223333.dkr.ecr.ap-southeast-1.amazonaws.com/greenmart/web,               newTag: 1.0.0 }

patches:
  # --- Dùng RDS: bỏ MySQL container ---
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: mysql }
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: mysql-init }
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: { name: allow-db-clients-to-mysql }

  # --- ConfigMap: RDS + domain ---
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: greenmart-config }
      data:
        DB_HOST: greenmart.abcdefghijkl.ap-southeast-1.rds.amazonaws.com   # ĐỔI: RDS endpoint
        PUBLIC_HOST: shop.example.com                                       # ĐỔI: domain
        PUBLIC_SCHEME: https
        CSRF_TRUSTED_ORIGINS: https://shop.example.com                      # ĐỔI
        WEB_ALLOWED_HOSTS: shop.example.com,localhost                       # ĐỔI

  # --- Ảnh sản phẩm trên EFS (RWX) ---
  - target: { kind: PersistentVolumeClaim, name: greenmart-media }
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: efs-sc

  # --- Ingress -> AWS Load Balancer Controller (ALB). TLS kết thúc tại ALB bằng ACM ---
  - target: { kind: Ingress, name: greenmart }
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: alb
      - op: remove
        path: /spec/tls
      - op: replace
        path: /spec/rules/0/host
        value: shop.example.com                                             # ĐỔI
      - op: replace
        path: /metadata/annotations
        value:
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
          alb.ingress.kubernetes.io/ssl-redirect: "443"
          alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-southeast-1:111122223333:certificate/00000000-0000-0000-0000-000000000000   # ĐỔI: ACM ARN
          alb.ingress.kubernetes.io/healthcheck-path: /gateway-health
          alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"

  # --- NetworkPolicy: ALB (target-type ip) gọi thẳng vào pod gateway từ IP trong VPC, không phải từ namespace ingress ---
  - target: { kind: NetworkPolicy, name: allow-ingress-controller-to-gateway }
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock: { cidr: 0.0.0.0/0 }      # nên siết lại thành CIDR VPC của bạn
