# StorageClass EBS gp3 cho ảnh sản phẩm (PVC greenmart-media). Cần addon aws-ebs-csi-driver (Terraform: infra/terraform/ebs.tf).
# Tag greenmart-backup=true để chính sách snapshot DLM (Terraform) tự sao lưu volume này mỗi ngày.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
  encrypted: "true"
  tagSpecification_1: "greenmart-backup=true"
reclaimPolicy: Retain               # xóa PVC không làm mất volume (tránh mất ảnh do thao tác nhầm)
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer   # volume tạo đúng AZ với node chạy pod
