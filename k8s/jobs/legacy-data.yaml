# Bước 1 chuyển dữ liệu: tạo PVC + pod tạm để `kubectl cp` file db.sqlite3 cũ vào. Xem k8s/README.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: greenmart-legacy-data
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Pod
metadata:
  name: legacy-uploader
spec:
  automountServiceAccountToken: false
  containers:
  - name: sh
    image: busybox:1.36
    command:
    - sleep
    - '3600'
    volumeMounts:
    - name: legacy
      mountPath: /legacy
  volumes:
  - name: legacy
    persistentVolumeClaim:
      claimName: greenmart-legacy-data
