# Bước 2: chạy SAU khi các Job migrate-* đã Complete. Mặc định chỉ --dry-run (thống kê, không ghi gì).
# Image build từ scripts/Dockerfile: docker build -f scripts/Dockerfile -t <registry>/greenmart-data-migrator:1.0 .
apiVersion: batch/v1
kind: Job
metadata:
  name: data-migrator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        greenmart/db-client: 'true'
        app.kubernetes.io/part-of: greenmart
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: migrator
        image: greenmart/data-migrator
        command:
        - python
        - /scripts/migrate_sqlite_to_mysql.py
        - --sqlite
        - /legacy/db.sqlite3
        - --host
        - $(DB_HOST)
        - --user
        - $(MYSQL_USER)
        - --password
        - $(MYSQL_PASSWORD)
        - --dry-run
        envFrom:
        - configMapRef:
            name: greenmart-config
        env:
        - name: MYSQL_USER
          value: root
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: greenmart-secrets
              key: MYSQL_ROOT_PASSWORD
        volumeMounts:
        - name: legacy
          mountPath: /legacy
          readOnly: true
      volumes:
      - name: legacy
        persistentVolumeClaim:
          claimName: greenmart-legacy-data
