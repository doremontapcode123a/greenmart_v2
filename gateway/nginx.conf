events {}

http {
    include       /etc/nginx/mime.types;
    client_max_body_size 10m;

    # Nếu đứng sau proxy/Ingress đã kết thúc TLS thì giữ nguyên scheme gốc, nếu không thì dùng scheme hiện tại.
    map $http_x_forwarded_proto $fwd_proto { default $http_x_forwarded_proto; "" $scheme; }

    upstream web             { server web:8000; }
    upstream user_service    { server user-service:8000; }
    upstream catalog_service { server catalog-service:8000; }

    server {
        listen 80;

        # Health check cho load balancer (ALB/ELB gửi Host = IP nên không đi qua Django)
        location = /gateway-health { access_log off; default_type text/plain; return 200 "ok\n"; }

        location = /metrics { return 404; }
        
        # File tĩnh (web + Django admin của user/catalog service gom vào cùng volume)
        location /static/ { alias /staticfiles/; }
        # Ảnh sản phẩm do catalog-service ghi, gateway chỉ đọc
        location /media/  { alias /media/; }

        # Django admin của từng service (order/promotion không expose; quản trị qua /admin_panel/)
        location /admin/catalog/ { proxy_pass http://catalog_service; include /etc/nginx/proxy_params; }
        location /admin/         { proxy_pass http://user_service;    include /etc/nginx/proxy_params; }

        # Storefront + admin panel (BFF)
        location / { proxy_pass http://web; include /etc/nginx/proxy_params; }
    }
}
