# Triển khai GreenMart lên EKS = tập hợp 7 giai đoạn (mỗi "###" trong note là một workflow con).
# Mỗi workflow con chứa các step ("#") của giai đoạn đó, và cũng chạy riêng được bằng Run workflow:
#   1 eks-step1-create-cluster.yml   2 eks-step2-bootstrap.yml        3 eks-step3-terraform.yml
#   4 eks-step4-push-images.yml      5 eks-step5-deploy.yml           6 eks-step6-media-admin.yml
#   7 eks-step7-migrate-legacy.yml   (chỉ chạy khi bật migrate_legacy)
#
# Cần trước:
#   secrets.AWS_ROLE_TO_ASSUME        IAM role tin cậy GitHub OIDC, đủ quyền EKS/EC2/IAM/RDS/ECR/CloudFormation/ELB/S3
#   vars.TF_STATE_BUCKET              S3 bucket (đã tạo sẵn) lưu Terraform state – runner mất sau mỗi lần chạy nên KHÔNG dùng state local
#   secrets.DJANGO_SUPERUSER_PASSWORD mật khẩu admin Django (giai đoạn 6)
#   (tuỳ chọn) vars.DJANGO_SUPERUSER_USERNAME / vars.DJANGO_SUPERUSER_EMAIL, vars.LEGACY_DB_S3_URI
name: Deploy EKS

on:
  workflow_dispatch:
    inputs:
      cluster_name:    { description: "Tên cluster EKS", required: true, default: "greenmart", type: string }
      aws_region:      { description: "AWS region", required: true, default: "ap-southeast-1", type: string }
      image_tag:       { description: "Tag image đẩy lên ECR và dùng trong overlay", required: true, default: "1.0.0", type: string }
      manifest_path: { description: "[Optional] Đường dẫn manifest nodegroup (nếu muốn tạo nodegroup theo manifest)", required: false, default: "infra/eks/cluster-config.yaml", type: string }
      quick_nodegroup: { description: "1. [Optional] Tạo thêm nodegroup nhanh (không cần manifest)", default: false, type: boolean }
      db_instance_class: { description: "3. Loại instance RDS (gói Free: db.t4g.micro)", default: "db.t4g.micro", type: string }
      db_backup_retention_days: { description: "3. Số ngày giữ backup RDS (gói Free: 1)", default: "1", type: string }
      migrate_legacy:  { description: "7. Chạy thêm bước migrate dữ liệu SQLite cũ", default: false, type: boolean }
      migrate_dry_run: { description: "7. Chỉ chạy thử (--dry-run), chưa ghi dữ liệu", default: true, type: boolean }
      

permissions:
  id-token: write   # assume role bằng OIDC
  contents: read

concurrency:
  group: deploy-eks-${{ inputs.cluster_name }}
  cancel-in-progress: false

jobs:
  Validate Nodegroup options:
      shell: bash
      run: |
        if [[ -n "${{ inputs.manifest_path }}" && \
                "${{ inputs.quick_nodegroup }}" == "true" ]]; then
            echo "::error::Không thể sử dụng manifest_path và quick_nodegroup cùng lúc."
            exit 1
        fi

  create-cluster:
    uses: ./.github/workflows/eks-step1-create-cluster.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}
      quick_nodegroup: ${{ inputs.quick_nodegroup }}
      manifest_path: ${{ inputs.manifest_path }}

  bootstrap:
    needs: create-cluster
    uses: ./.github/workflows/eks-step2-bootstrap.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}

  terraform:
    needs: bootstrap
    uses: ./.github/workflows/eks-step3-terraform.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}
      db_instance_class: ${{ inputs.db_instance_class }}
      db_backup_retention_days: ${{ inputs.db_backup_retention_days }}

  push-images:
    needs: terraform
    uses: ./.github/workflows/eks-step4-push-images.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}
      image_tag: ${{ inputs.image_tag }}

  deploy:
    needs: push-images
    uses: ./.github/workflows/eks-step5-deploy.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}
      image_tag: ${{ inputs.image_tag }}

  media-and-admin:
    needs: deploy
    uses: ./.github/workflows/eks-step6-media-admin.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}

  migrate-legacy:
    needs: media-and-admin
    if: ${{ inputs.migrate_legacy }}
    uses: ./.github/workflows/eks-step7-migrate-legacy.yml
    secrets: inherit
    with:
      cluster_name: ${{ inputs.cluster_name }}
      aws_region: ${{ inputs.aws_region }}
      image_tag: ${{ inputs.image_tag }}
      migrate_dry_run: ${{ inputs.migrate_dry_run }}
