name: EKS setup
description: Đăng nhập AWS (OIDC), cập nhật kubeconfig cho cluster và xuất ACCOUNT_ID.
inputs:
  role-to-assume:        { description: "ARN IAM role (OIDC). Bỏ trống nếu dùng access key", required: false, default: "" }
  aws-access-key-id:     { description: "Access key (nếu không dùng OIDC)", required: false, default: "" }
  aws-secret-access-key: { description: "Secret access key (nếu không dùng OIDC)", required: false, default: "" }
  region:         { description: "AWS region", required: true }
  cluster-name:   { description: "Tên cluster EKS", required: true }
  kubeconfig:     { description: "Có cập nhật kubeconfig không", required: false, default: "true" }
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.region }}

    - name: Xuất ACCOUNT_ID
      shell: bash
      run: echo "ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

    - name: Cập nhật kubeconfig
      if: ${{ inputs.kubeconfig == 'true' }}
      shell: bash
      run: aws eks update-kubeconfig --region "${{ inputs.region }}" --name "${{ inputs.cluster-name }}"
