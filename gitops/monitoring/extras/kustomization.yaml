# Phần bổ sung cho stack giám sát: X-Ray daemon, PodMonitor (Prometheus scrape GreenMart) và dashboard so sánh.
# Application monitoring-extras (gitops/apps/monitoring-extras.yaml.tpl) thêm patch: role IRSA và region cho X-Ray daemon.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

resources:
  - xray-daemon.yaml
  - podmonitor-greenmart.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"   # sidecar của Grafana tự nạp ConfigMap có nhãn này

configMapGenerator:
  - name: dashboard-greenmart-compare
    files:
      - dashboards/greenmart-compare.json
